<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="青年猪">
  <title>青年猪</title>
  <!-- 基准身体：3/4 侧脸朝左，平涂零描边。呼吸、眨眼、甩尾巴。 -->
  <style>
    .body{animation:breathe 2.6s ease-in-out infinite;transform-origin:64px 114px}
    .eye{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:50% 50%}
    .tail{animation:wag 1.4s ease-in-out infinite;transform-origin:108px 52px}
    .ear{animation:flick 5.2s ease-in-out infinite;transform-origin:62px 40px}
    @keyframes breathe{50%{transform:scale(1.015,.975)}}
    @keyframes blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
    @keyframes wag{50%{transform:rotate(16deg)}}
    @keyframes flick{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-14deg)}90%{transform:rotate(4deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 远侧两条腿，粉色 -->
    <rect x="45" y="84" width="11" height="27" rx="5.5" fill="#FF9FA5"/>
    <rect x="92" y="82" width="11" height="27" rx="5.5" fill="#FF9FA5"/>
    <g class="body">
      <path class="tail" d="M106 52c6-1 10-6 7-10s-9 1-5 5 9 1 11-3" fill="none" stroke="#FFD1AF" stroke-width="4.5"/>
      <path d="M22 66C20 44 38 32 62 32S108 38 110 62 98 98 70 99 24 92 22 66Z" fill="#FFD1AF"/>
      <ellipse cx="68" cy="98" rx="7" ry="4.5" fill="#FF9FA5"/>
      <!-- 耳朵：洋红圆头弧线 -->
      <path d="M38 33C28 30 21 39 25 47" fill="none" stroke="#E95892" stroke-width="5.5"/>
      <path class="ear" d="M57 37C55 49 59 54 63 54C68 54 70 47 69 39" fill="none" stroke="#E95892" stroke-width="5.5"/>
      <!-- 眼睛：不是正圆 -->
      <path class="eye" d="M31 54c-3 0-4.5 2.6-4.3 5 .2 2.5 2 4 4.3 3.9 2.4-.1 3.9-2 3.8-4.6C34.7 55.8 33.4 54 31 54Z" fill="#373A32"/>
      <path class="eye" d="M50 57c-3 0-4.4 2.4-4.2 4.9.2 2.5 1.9 4 4.2 3.9 2.4-.1 4-2.1 3.8-4.6C53.6 58.8 52.4 57 50 57Z" fill="#373A32"/>
      <ellipse cx="51" cy="73" rx="5.5" ry="3.2" fill="#FFAFAC"/>
      <!-- 歪着的粉鼻子 -->
      <path d="M26 65c-8 0-13 4.5-13 9.5S18 84 27 84s13-4 13-9.5S34 65 26 65Z" fill="#FF8195"/>
      <ellipse cx="22" cy="74.5" rx="2.1" ry="3.1" fill="#373A32"/>
      <ellipse cx="30.5" cy="75" rx="2.1" ry="3.1" fill="#373A32"/>
    </g>
    <!-- 近侧两条腿 -->
    <rect x="29" y="84" width="13" height="30" rx="6.5" fill="#FFD1AF"/>
    <rect x="77" y="84" width="13" height="30" rx="6.5" fill="#FFD1AF"/>
  </g>
</svg>
