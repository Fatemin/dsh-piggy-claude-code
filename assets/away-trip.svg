<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="在旅行">
  <title>在旅行</title>
  <!-- 戴草帽、背小包往左走：四条腿交替迈步（参考 sample 里走路的猪），身子一颠一颠，脚下的路往后退。 -->
  <style>
    .walk{animation:bob .5s ease-in-out infinite}
    .a{animation:stepA 1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
    .b{animation:stepA 1s ease-in-out -.5s infinite;transform-box:fill-box;transform-origin:50% 0}
    .road{animation:road 1s linear infinite}
    .tail{animation:wag .5s ease-in-out infinite;transform-origin:104px 54px}
    @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-1.5deg)}}
    @keyframes stepA{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}}
    @keyframes road{to{transform:translateX(24px)}}
    @keyframes wag{50%{transform:rotate(20deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 路 -->
    <g class="road">
      <path d="M-20 120H4M28 120H52M76 120H100M124 120H148" fill="none" stroke="#D9CBB3" stroke-width="3"/>
    </g>
    <rect class="b" x="45" y="84" width="11" height="26" rx="5.5" fill="#FF9FA5"/>
    <rect class="a" x="92" y="82" width="11" height="26" rx="5.5" fill="#FF9FA5"/>
    <g class="walk">
      <path class="tail" d="M104 54c6-1 10-6 7-10s-9 1-5 5 9 1 11-3" fill="none" stroke="#FFD1AF" stroke-width="4.5"/>
      <path d="M22 66C20 44 38 32 62 32S108 38 110 62 98 98 70 99 24 92 22 66Z" fill="#FFD1AF"/>
      <!-- 背包 -->
      <rect x="66" y="36" width="34" height="34" rx="10" fill="#6FA8DC"/>
      <rect x="70" y="56" width="26" height="12" rx="5" fill="#5A93C8"/>
      <path d="M68 46Q58 60 68 76" fill="none" stroke="#4E7FB0" stroke-width="3.2"/>
      <path d="M38 33C28 30 21 39 25 47" fill="none" stroke="#E95892" stroke-width="5.5"/>
      <!-- 草帽 -->
      <ellipse cx="44" cy="34" rx="22" ry="5" fill="#E9C46A"/>
      <path d="M32 33C32 22 56 22 56 33Z" fill="#F2D488"/>
      <path d="M32.5 30H55.5" fill="none" stroke="#E5534B" stroke-width="3"/>
      <path d="M31 54c-3 0-4.5 2.6-4.3 5 .2 2.5 2 4 4.3 3.9 2.4-.1 3.9-2 3.8-4.6C34.7 55.8 33.4 54 31 54Z" fill="#373A32"/>
      <path d="M50 57c-3 0-4.4 2.4-4.2 4.9.2 2.5 1.9 4 4.2 3.9 2.4-.1 4-2.1 3.8-4.6C53.6 58.8 52.4 57 50 57Z" fill="#373A32"/>
      <ellipse cx="51" cy="73" rx="5.5" ry="3.2" fill="#FFAFAC"/>
      <path d="M26 65c-8 0-13 4.5-13 9.5S18 84 27 84s13-4 13-9.5S34 65 26 65Z" fill="#FF8195"/>
      <ellipse cx="22" cy="74.5" rx="2.1" ry="3.1" fill="#373A32"/>
      <ellipse cx="30.5" cy="75" rx="2.1" ry="3.1" fill="#373A32"/>
      <path d="M39 80Q43 84 47 79" fill="none" stroke="#C2566B" stroke-width="2.4"/>
    </g>
    <rect class="a" x="29" y="84" width="13" height="29" rx="6.5" fill="#FFD1AF"/>
    <rect class="b" x="77" y="84" width="13" height="29" rx="6.5" fill="#FFD1AF"/>
  </g>
</svg>
