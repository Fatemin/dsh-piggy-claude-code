<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="病好了">
  <title>病好了</title>
  <!-- 病好了：额头贴着一块创可贴，挺胸站直，绿色十字和小光点往上飘，身后一圈柔光。 -->
  <style>
    .glow{animation:glow 1.2s ease-in-out infinite;transform-origin:64px 70px}
    .stand{animation:stand 1.2s ease-out infinite;transform-origin:64px 114px}
    .c1{animation:rise 1.4s ease-out infinite}
    .c2{animation:rise 1.4s ease-out -.5s infinite}
    .c3{animation:rise 1.4s ease-out -1s infinite}
    @keyframes glow{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:.7;transform:scale(1.04)}}
    @keyframes stand{0%{transform:scale(1.04,.94)}30%{transform:scale(.98,1.04) translateY(-3px)}60%,100%{transform:scale(1)}}
    @keyframes rise{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g stroke-linecap="round" stroke-linejoin="round">
    <ellipse class="glow" cx="64" cy="70" rx="58" ry="48" fill="#DFF3D4"/>
    <path class="c1" d="M14 40h4v-4h4v4h4v4h-4v4h-4v-4h-4Z" fill="#6CC27A"/>
    <path class="c2" d="M100 28h3v-3h3v3h3v3h-3v3h-3v-3h-3Z" fill="#6CC27A"/>
    <circle class="c3" cx="84" cy="22" r="2.4" fill="#FFE27A"/>
    <g class="stand">
      <rect x="45" y="84" width="11" height="27" rx="5.5" fill="#FF9FA5"/>
      <rect x="92" y="82" width="11" height="27" rx="5.5" fill="#FF9FA5"/>
      <path d="M106 52c6-1 10-6 7-10s-9 1-5 5 9 1 11-3" fill="none" stroke="#FFD1AF" stroke-width="4.5"/>
      <path d="M22 66C20 44 38 32 62 32S108 38 110 62 98 98 70 99 24 92 22 66Z" fill="#FFD1AF"/>
      <ellipse cx="68" cy="98" rx="7" ry="4.5" fill="#FF9FA5"/>
      <path d="M36 34C28 28 20 33 22 42" fill="none" stroke="#E95892" stroke-width="5.5"/>
      <path d="M58 36C56 46 60 50 64 50C69 50 71 44 70 34" fill="none" stroke="#E95892" stroke-width="5.5"/>
      <!-- 创可贴 -->
      <path d="M34 44L50 40L52 46L36 50Z" fill="#F6D7A7"/>
      <path d="M41 44L45 43" fill="none" stroke="#E5BD84" stroke-width="2.4"/>
      <path d="M31 54c-3 0-4.5 2.6-4.3 5 .2 2.5 2 4 4.3 3.9 2.4-.1 3.9-2 3.8-4.6C34.7 55.8 33.4 54 31 54Z" fill="#373A32"/>
      <path d="M50 57c-3 0-4.4 2.4-4.2 4.9.2 2.5 1.9 4 4.2 3.9 2.4-.1 4-2.1 3.8-4.6C53.6 58.8 52.4 57 50 57Z" fill="#373A32"/>
      <circle cx="32.4" cy="56.6" r="1.1" fill="#fff"/>
      <circle cx="51.4" cy="59.6" r="1.1" fill="#fff"/>
      <ellipse cx="52" cy="73" rx="6.5" ry="3.6" fill="#FF9AA0"/>
      <path d="M26 65c-8 0-13 4.5-13 9.5S18 84 27 84s13-4 13-9.5S34 65 26 65Z" fill="#FF8195"/>
      <ellipse cx="22" cy="74.5" rx="2.1" ry="3.1" fill="#373A32"/>
      <ellipse cx="30.5" cy="75" rx="2.1" ry="3.1" fill="#373A32"/>
      <path d="M39 80Q43 85 47 79" fill="none" stroke="#C2566B" stroke-width="2.4"/>
      <rect x="29" y="84" width="13" height="30" rx="6.5" fill="#FFD1AF"/>
      <rect x="77" y="84" width="13" height="30" rx="6.5" fill="#FFD1AF"/>
    </g>
  </g>
</svg>
