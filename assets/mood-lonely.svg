<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="有点孤单">
  <title>有点孤单</title>
  <!-- 坐着，头低着，耳朵往下耷拉，眼眶含着泪（参考 sample 里的含泪猪），一滴一滴往下掉。 -->
  <style>
    .sway{animation:sway 4s ease-in-out infinite;transform-origin:64px 114px}
    .tear{animation:drop 2.4s ease-in infinite}
    .tear2{animation:drop 2.4s ease-in -1.2s infinite}
    @keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) translateY(1px)}}
    @keyframes drop{0%,40%{opacity:0;transform:translateY(0)}50%{opacity:1}100%{opacity:0;transform:translateY(16px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g class="sway" stroke-linecap="round" stroke-linejoin="round">
    <!-- 坐姿：屁股着地，后背往右下 -->
    <path d="M116 108c4 0 6-3 4-5" fill="none" stroke="#FFD1AF" stroke-width="4.5"/>
    <path d="M28 70C26 48 42 36 62 36S102 48 110 76 112 114 80 114H40C24 114 30 92 28 70Z" fill="#FFD1AF"/>
    <ellipse cx="96" cy="112" rx="14" ry="5" fill="#FF9FA5"/>
    <rect x="50" y="90" width="11" height="22" rx="5.5" fill="#FF9FA5"/>
    <path d="M70 112Q68 92 90 90" fill="none" stroke="#F4BC97" stroke-width="3"/>
    <rect x="35" y="90" width="13" height="24" rx="6.5" fill="#FFD1AF"/>
    <!-- 往下耷拉的耳朵 -->
    <path d="M40 42C30 44 26 52 28 60" fill="none" stroke="#E95892" stroke-width="5.5"/>
    <path d="M62 44C66 54 72 58 78 56" fill="none" stroke="#E95892" stroke-width="5.5"/>
    <path d="M30 60L38 63M48 64L56 62" fill="none" stroke="#D99A7A" stroke-width="2"/>
    <path d="M34 66c-3 0-4.4 2.4-4.2 4.9.2 2.5 1.9 4 4.2 3.9 2.4-.1 3.9-2 3.8-4.6C37.7 67.8 36.4 66 34 66Z" fill="#373A32"/>
    <path d="M52 68c-3 0-4.4 2.4-4.2 4.9.2 2.5 1.9 4 4.2 3.9 2.4-.1 4-2.1 3.8-4.6C55.6 69.8 54.4 68 52 68Z" fill="#373A32"/>
    <path d="M30.5 75.5Q34 77.5 37.5 75.5M48.5 77.5Q52 79.5 55.5 77.5" fill="none" stroke="#6EC3EA" stroke-width="2.4"/>
    <path class="tear" d="M37 77c-1.4 2.6-2 4.2-2 5.4a2 2 0 0 0 4 0c0-1.2-.6-2.8-2-5.4Z" fill="#6EC3EA"/>
    <path class="tear2" d="M55 79c-1.4 2.6-2 4.2-2 5.4a2 2 0 0 0 4 0c0-1.2-.6-2.8-2-5.4Z" fill="#6EC3EA"/>
    <path d="M30 80c-8 0-13 4.5-13 9.5S22 99 31 99s13-4 13-9.5S38 80 30 80Z" fill="#FF8195"/>
    <ellipse cx="26" cy="89.5" rx="2.1" ry="3.1" fill="#373A32"/>
    <ellipse cx="34.5" cy="90" rx="2.1" ry="3.1" fill="#373A32"/>
  </g>
</svg>
