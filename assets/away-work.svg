<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="在打工">
  <title>在打工</title>
  <!-- 坐在桌前对着笔记本，一只蹄子搭在键盘上啪嗒啪嗒地敲；桌角一杯冒热气的咖啡。 -->
  <style>
    .hoof{animation:type .35s ease-in-out infinite;transform-origin:74px 80px}
    .head{animation:focus 1.4s ease-in-out infinite;transform-origin:70px 70px}
    .steam{animation:steam 2s ease-in-out infinite}
    .glow{animation:glow .7s steps(2) infinite}
    .eye{animation:blink 3.8s infinite;transform-box:fill-box;transform-origin:50% 50%}
    @keyframes type{50%{transform:rotate(-7deg) translateY(-1px)}}
    @keyframes focus{50%{transform:translateY(1px) rotate(-1deg)}}
    @keyframes steam{0%,100%{opacity:0;transform:translateY(3px)}50%{opacity:.9;transform:translateY(-3px)}}
    @keyframes glow{50%{opacity:.4}}
    @keyframes blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 猪：坐着，身子在桌子后面 -->
    <path d="M114 62c5-1 8-5 6-9" fill="none" stroke="#FFD1AF" stroke-width="4.5"/>
    <path d="M50 64C48 42 64 30 84 30S118 42 118 68 114 112 92 112H70C56 112 52 90 50 64Z" fill="#FFD1AF"/>
    <ellipse cx="100" cy="112" rx="14" ry="4.5" fill="#FF9FA5"/>
    <g class="head">
      <path d="M64 33C55 31 49 38 52 46" fill="none" stroke="#E95892" stroke-width="5.5"/>
      <path d="M80 36C79 47 83 51 87 51C91 51 93 45 92 38" fill="none" stroke="#E95892" stroke-width="5.5"/>
      <path class="eye" d="M60 52c-2.8 0-4.2 2.3-4 4.6.2 2.3 1.8 3.7 4 3.6 2.2-.1 3.7-1.9 3.6-4.3C63.5 53.7 62.3 52 60 52Z" fill="#373A32"/>
      <path class="eye" d="M77 55c-2.8 0-4.1 2.2-3.9 4.5.2 2.3 1.7 3.7 3.9 3.6 2.2-.1 3.7-2 3.6-4.3C80.4 56.6 79.3 55 77 55Z" fill="#373A32"/>
      <path d="M55 48L63 49.5M72 51.5L80 52.5" fill="none" stroke="#D99A7A" stroke-width="2"/>
      <ellipse cx="80" cy="68" rx="5" ry="3" fill="#FFAFAC"/>
      <path d="M56 61c-7 0-11.5 4-11.5 8.5S49 78 57 78s11.5-3.6 11.5-8.5S63 61 56 61Z" fill="#FF8195"/>
      <ellipse cx="52.4" cy="69.6" rx="1.9" ry="2.8" fill="#373A32"/>
      <ellipse cx="60" cy="70" rx="1.9" ry="2.8" fill="#373A32"/>
    </g>
    <!-- 桌子 -->
    <rect x="4" y="80" width="78" height="6" rx="3" fill="#C69C6D"/>
    <rect x="8" y="86" width="6" height="30" rx="3" fill="#B0875A"/>
    <rect x="70" y="86" width="6" height="30" rx="3" fill="#B0875A"/>
    <!-- 笔记本：看到的是屏幕背面，盖子上印着猪鼻子 -->
    <path d="M14 78L22 48H46L40 78Z" fill="#B9C2CC"/>
    <path class="glow" d="M40 78L46 48" fill="none" stroke="#BFE6FF" stroke-width="2"/>
    <ellipse cx="31" cy="63" rx="5" ry="3.6" fill="#D5DCE3"/>
    <rect x="12" y="76" width="50" height="4" rx="2" fill="#98A3AE"/>
    <!-- 敲键盘的蹄子 -->
    <path class="hoof" d="M76 82L54 76" fill="none" stroke="#FFD1AF" stroke-width="11"/>
    <!-- 咖啡 -->
    <path class="steam" d="M8 62q-2-3 0-6t0-6M13 62q-2-3 0-6" fill="none" stroke="#D8CFC2" stroke-width="1.8"/>
    <path d="M5 66H16V76C16 78 15 79 13 79H8C6 79 5 78 5 76Z" fill="#FFFFFF"/>
    <path d="M16 69C20 69 20 75 16 75" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  </g>
</svg>
