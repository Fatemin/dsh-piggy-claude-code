<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="墓碑">
  <title>墓碑</title>
  <!-- 圆头墓碑，碑顶两只褪了色的小耳朵，碑面刻一个猪鼻子。安静干净；只有旁边的小花在晃。 -->
  <style>
    .flower{animation:sway 3.6s ease-in-out infinite;transform-origin:102px 112px}
    .grass{animation:sway 4.4s ease-in-out -1s infinite;transform-origin:26px 112px}
    @keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 34C38 30 34 36 37 42M84 34C90 30 94 36 91 42" fill="none" stroke="#D7A6B6" stroke-width="5"/>
    <path d="M32 112V62C32 42 46 30 64 30S96 42 96 62V112Z" fill="#D3CCC0"/>
    <path d="M86 40C92 46 96 54 96 62V112H86Z" fill="#BDB5A8"/>
    <!-- 刻上去的猪鼻子 -->
    <ellipse cx="62" cy="66" rx="14" ry="10" fill="#B6AE9F"/>
    <ellipse cx="57" cy="66" rx="2.4" ry="3.6" fill="#9A9284"/>
    <ellipse cx="67" cy="66" rx="2.4" ry="3.6" fill="#9A9284"/>
    <path d="M48 88H76M52 96H72" fill="none" stroke="#BDB5A8" stroke-width="3"/>
    <!-- 小土包 -->
    <path d="M14 116C24 106 44 104 64 104S104 106 114 116Z" fill="#A9C98A"/>
    <path class="grass" d="M24 112L22 102M28 112L30 100M32 112L36 104" fill="none" stroke="#86AD68" stroke-width="2.6"/>
    <g class="flower">
      <path d="M102 112V96" fill="none" stroke="#86AD68" stroke-width="2.6"/>
      <circle cx="98" cy="92" r="3.4" fill="#FFAFAC"/>
      <circle cx="106" cy="92" r="3.4" fill="#FFAFAC"/>
      <circle cx="102" cy="88" r="3.4" fill="#FFAFAC"/>
      <circle cx="102" cy="96" r="3.4" fill="#FFAFAC"/>
      <circle cx="102" cy="92" r="2.6" fill="#F5D76E"/>
    </g>
  </g>
</svg>
