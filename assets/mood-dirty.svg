<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="该洗澡了">
  <title>该洗澡了</title>
  <!-- 身上几块泥点，耳朵塌着，屁股后面一坨便便（sample 里的「猪如厕」），一只苍蝇绕着飞。 -->
  <style>
    .fly{animation:orbit 2.2s linear infinite;transform-origin:96px 52px}
    .wing{animation:buzz .12s linear infinite;transform-box:fill-box;transform-origin:50% 100%}
    .stink{animation:stink 2s ease-in-out infinite}
    .body{animation:itch 3s ease-in-out infinite;transform-origin:64px 114px}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes buzz{50%{transform:scaleY(.4)}}
    @keyframes stink{0%,100%{opacity:0;transform:translateY(4px)}50%{opacity:.9;transform:translateY(-3px)}}
    @keyframes itch{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-2deg)}82%{transform:rotate(2deg)}88%{transform:rotate(-1deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g stroke-linecap="round" stroke-linejoin="round">
    <g class="body">
      <rect x="45" y="84" width="11" height="27" rx="5.5" fill="#FF9FA5"/>
      <rect x="92" y="82" width="11" height="27" rx="5.5" fill="#FF9FA5"/>
      <path d="M106 54c5 0 8-4 6-7" fill="none" stroke="#FFD1AF" stroke-width="4.5"/>
      <path d="M22 66C20 44 38 32 62 32S108 38 110 62 98 98 70 99 24 92 22 66Z" fill="#FFD1AF"/>
      <ellipse cx="68" cy="98" rx="7" ry="4.5" fill="#FF9FA5"/>
      <!-- 泥点 -->
      <path d="M72 44c6-2 12 1 11 6s-8 4-12 2-4-7 1-8Z" fill="#B88A63"/>
      <path d="M90 68c4-1 8 2 7 5s-5 4-8 2-3-6 1-7Z" fill="#B88A63"/>
      <ellipse cx="62" cy="82" rx="4" ry="2.6" fill="#B88A63"/>
      <circle cx="80" cy="58" r="1.6" fill="#B88A63"/>
      <!-- 塌下去的耳朵 -->
      <path d="M36 37C27 36 22 44 24 52" fill="none" stroke="#E95892" stroke-width="5.5"/>
      <path d="M58 40C60 51 66 54 71 52C75 50 76 46 74 43" fill="none" stroke="#E95892" stroke-width="5.5"/>
      <path d="M27 58.5Q31 61 35 58.5M46 61.5Q50 64 54 61.5" fill="none" stroke="#373A32" stroke-width="3"/>
      <path d="M26 65c-8 0-13 4.5-13 9.5S18 84 27 84s13-4 13-9.5S34 65 26 65Z" fill="#FF8195"/>
      <ellipse cx="22" cy="74.5" rx="2.1" ry="3.1" fill="#373A32"/>
      <ellipse cx="30.5" cy="75" rx="2.1" ry="3.1" fill="#373A32"/>
      <path d="M17 81c3-1 6 0 6 2" fill="none" stroke="#B88A63" stroke-width="2.4"/>
      <rect x="29" y="84" width="13" height="30" rx="6.5" fill="#FFD1AF"/>
      <rect x="77" y="84" width="13" height="30" rx="6.5" fill="#FFD1AF"/>
      <path d="M77 106h13v4.5a6.5 6.5 0 0 1-13 0Z" fill="#B88A63"/>
    </g>
    <!-- 便便 -->
    <path d="M106 114c-5 0-7-3-5-5-2-2 0-5 3-5-1-3 2-5 4-4 3 0 5 2 4 4 3 0 5 3 3 5 2 2 0 5-5 5Z" fill="#8A5A3B"/>
    <path class="stink" d="M104 98q-3-4 0-8t0-8M112 98q-3-4 0-8" fill="none" stroke="#A9C98A" stroke-width="2.2"/>
    <!-- 苍蝇 -->
    <g class="fly">
      <g transform="translate(96 30)">
        <ellipse class="wing" cx="-2" cy="-3" rx="2.2" ry="3.4" fill="#DDEFF7"/>
        <ellipse class="wing" cx="2" cy="-3" rx="2.2" ry="3.4" fill="#DDEFF7"/>
        <circle r="2.8" fill="#3E3A35"/>
      </g>
    </g>
  </g>
</svg>
