<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="生病了">
  <title>生病了</title>
  <!-- 趴着，脸发红，眼睛眯成两道缝，额头搭着湿毛巾，嘴里叼着体温计；时不时打个哆嗦、咳一下。 -->
  <style>
    .body{animation:shiver 2.2s ease-in-out infinite;transform-origin:64px 114px}
    .heat{animation:heat 2.2s ease-in-out infinite}
    .cough{animation:cough 2.2s ease-out infinite}
    @keyframes shiver{0%,60%,100%{transform:translateX(0)}64%{transform:translateX(-2px) rotate(-1.5deg)}68%{transform:translateX(2px) rotate(1deg)}72%{transform:translateX(-1px)}}
    @keyframes heat{0%,100%{opacity:.2;transform:translateY(3px)}50%{opacity:1;transform:translateY(-3px)}}
    @keyframes cough{0%,62%{opacity:0;transform:translateX(0)}70%{opacity:1}100%{opacity:0;transform:translateX(-8px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path class="heat" d="M40 38q-3-4 0-8t0-8M50 36q-3-4 0-8t0-8" fill="none" stroke="#FFB0A0" stroke-width="2.4"/>
    <g class="body">
      <path d="M110 78c4 0 7-2 5-5" fill="none" stroke="#F7C8A8" stroke-width="4.5"/>
      <path d="M14 90C12 70 34 58 62 58S114 64 116 86 102 114 66 114 16 110 14 90Z" fill="#F7C9AA"/>
      <ellipse cx="38" cy="114" rx="10" ry="4" fill="#FF9FA5"/>
      <ellipse cx="88" cy="114" rx="10" ry="4" fill="#FF9FA5"/>
      <path d="M30 64C21 64 16 72 19 79" fill="none" stroke="#D96A94" stroke-width="5.5"/>
      <path d="M50 66C51 76 56 80 60 79C64 78 65 73 63 68" fill="none" stroke="#D96A94" stroke-width="5.5"/>
      <!-- 湿毛巾 -->
      <path d="M18 66L52 70L50 78L16 74Z" fill="#9FD3E6"/>
      <path d="M24 70L24 73M32 71L32 74M40 72L40 75" fill="none" stroke="#7FBFD6" stroke-width="1.6"/>
      <path d="M22 84L30 84M40 86L48 86" fill="none" stroke="#373A32" stroke-width="2.8"/>
      <ellipse cx="34" cy="92" rx="18" ry="5" fill="#FF8A8A" opacity=".45"/>
      <path d="M20 90c-7.5 0-12 4-12 8.8S12.5 108 21 108s12-3.7 12-8.8S28 90 20 90Z" fill="#FF6F86"/>
      <ellipse cx="16" cy="98.8" rx="2" ry="2.9" fill="#373A32"/>
      <ellipse cx="24" cy="99.3" rx="2" ry="2.9" fill="#373A32"/>
      <!-- 体温计 -->
      <path d="M30 106L46 112" fill="none" stroke="#F4F6F8" stroke-width="4"/>
      <path d="M38 109L46 112" fill="none" stroke="#E5534B" stroke-width="2"/>
    </g>
    <path class="cough" d="M6 94q-3 3 0 6M2 90q-4 6 0 12" fill="none" stroke="#C9C3B8" stroke-width="2"/>
  </g>
</svg>
