<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="中年猪">
  <title>中年猪</title>
  <!-- 有分量了：身子又大又圆，脸相对变小，双下巴。呼吸慢、肚子一颤一颤。 -->
  <style>
    .body{animation:breathe 3.2s ease-in-out infinite;transform-origin:66px 116px}
    .belly{animation:jiggle 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
    .eye{animation:blink 5s infinite;transform-box:fill-box;transform-origin:50% 50%}
    .tail{animation:wag 2s ease-in-out infinite;transform-origin:114px 52px}
    @keyframes breathe{50%{transform:scale(1.025,.97)}}
    @keyframes jiggle{50%{transform:scaleY(1.12)}}
    @keyframes blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
    @keyframes wag{50%{transform:rotate(12deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="46" y="92" width="12" height="21" rx="6" fill="#FF9FA5"/>
    <rect x="98" y="88" width="12" height="22" rx="6" fill="#FF9FA5"/>
    <g class="body">
      <path class="tail" d="M112 52c6-1 10-6 7-10s-9 1-5 5 9 1 11-3" fill="none" stroke="#FFD1AF" stroke-width="4.5"/>
      <path d="M14 66C12 38 34 24 64 24S118 34 119 62 108 106 72 106 16 96 14 66Z" fill="#FFD1AF"/>
      <ellipse class="belly" cx="72" cy="104" rx="8" ry="4.5" fill="#FF9FA5"/>
      <path d="M33 28C24 25 17 33 20 41" fill="none" stroke="#E95892" stroke-width="5"/>
      <path d="M50 30C48 41 52 46 56 46C60 46 62 40 61 33" fill="none" stroke="#E95892" stroke-width="5"/>
      <path class="eye" d="M27 48c-2.7 0-4 2.3-3.8 4.5.2 2.2 1.7 3.5 3.8 3.4 2.2-.1 3.5-1.8 3.4-4.1C30.3 49.6 29.2 48 27 48Z" fill="#373A32"/>
      <path class="eye" d="M44 51c-2.6 0-3.9 2.2-3.7 4.4.2 2.2 1.7 3.5 3.7 3.4 2.2-.1 3.5-1.9 3.4-4.1C47.3 52.6 46.2 51 44 51Z" fill="#373A32"/>
      <ellipse cx="45" cy="66" rx="5" ry="3" fill="#FFAFAC"/>
      <path d="M22 59c-7.5 0-12 4-12 8.8S14.5 77 23 77s12-3.7 12-8.8S30 59 22 59Z" fill="#FF8195"/>
      <ellipse cx="18" cy="67.8" rx="2" ry="2.9" fill="#373A32"/>
      <ellipse cx="26" cy="68.3" rx="2" ry="2.9" fill="#373A32"/>
      <!-- 双下巴 -->
      <path d="M20 83Q30 89 41 84" fill="none" stroke="#F4BC97" stroke-width="3"/>
    </g>
    <rect x="29" y="92" width="14" height="23" rx="7" fill="#FFD1AF"/>
    <rect x="82" y="92" width="14" height="23" rx="7" fill="#FFD1AF"/>
  </g>
</svg>
