<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="小猪">
  <title>小猪</title>
  <!-- 刚出纸盒：头大身子小，腿短，眼睛带高光。走两步颠一下。 -->
  <style>
    .hop{animation:hop 1.6s ease-in-out infinite;transform-origin:64px 110px}
    .eye{animation:blink 3.6s infinite;transform-box:fill-box;transform-origin:50% 50%}
    .tail{animation:wag .9s ease-in-out infinite;transform-origin:98px 58px}
    .legA{animation:step .8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
    .legB{animation:step .8s ease-in-out -.4s infinite;transform-box:fill-box;transform-origin:50% 0}
    @keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-4px) scale(.98,1.02)}70%{transform:translateY(0) scale(1.03,.97)}}
    @keyframes blink{0%,88%,100%{transform:scaleY(1)}91%{transform:scaleY(.1)}}
    @keyframes wag{50%{transform:rotate(22deg)}}
    @keyframes step{50%{transform:rotate(9deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g class="hop" stroke-linecap="round" stroke-linejoin="round">
    <rect class="legB" x="48" y="86" width="12" height="21" rx="6" fill="#FF9FA5"/>
    <rect class="legA" x="84" y="84" width="12" height="21" rx="6" fill="#FF9FA5"/>
    <path class="tail" d="M97 58c5-1 9-5 6-9s-8 1-4 5 8 1 10-3" fill="none" stroke="#FFD1AF" stroke-width="4.5"/>
    <path d="M22 68C20 44 38 34 60 34S100 42 101 66 90 97 63 97 24 92 22 68Z" fill="#FFD1AF"/>
    <path d="M42 36C31 31 22 40 25 49" fill="none" stroke="#E95892" stroke-width="6"/>
    <path d="M60 38C58 50 62 56 67 56C72 56 74 49 73 41" fill="none" stroke="#E95892" stroke-width="6"/>
    <g class="eye">
      <path d="M33 53c-3.6 0-5.3 3-5 5.9.2 3 2.3 4.7 5 4.6 2.9-.1 4.6-2.4 4.5-5.4C37.4 55.1 35.8 53 33 53Z" fill="#373A32"/>
      <circle cx="34.6" cy="56" r="1.2" fill="#fff"/>
    </g>
    <g class="eye">
      <path d="M55 56c-3.5 0-5.2 2.8-5 5.8.2 3 2.2 4.7 5 4.6 2.8-.1 4.6-2.5 4.4-5.4C59.3 58.1 57.8 56 55 56Z" fill="#373A32"/>
      <circle cx="56.5" cy="59" r="1.2" fill="#fff"/>
    </g>
    <ellipse cx="57" cy="75" rx="6" ry="3.5" fill="#FFAFAC"/>
    <path d="M28 65c-9 0-15 5-15 10.5S19 86 29 86s15-4.5 15-10.5S37 65 28 65Z" fill="#FF8195"/>
    <ellipse cx="23.5" cy="75.5" rx="2.3" ry="3.4" fill="#373A32"/>
    <ellipse cx="33" cy="76" rx="2.3" ry="3.4" fill="#373A32"/>
    <rect class="legA" x="33" y="86" width="14" height="23" rx="7" fill="#FFD1AF"/>
    <rect class="legB" x="70" y="86" width="14" height="23" rx="7" fill="#FFD1AF"/>
  </g>
</svg>
