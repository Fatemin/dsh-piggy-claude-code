<script>
  // [dsh-piggy-claude-code mod] The big panel: the same client.js as the

  // with a game skin and a spreadsheet skin. Opened from the desktop apps'
  // menus, the floating panel's ⤢ button, or `pig serve` in a browser.
  let entry = null
  window.__ModuleLoader__ = { load: e => { entry = e } }
</script>

<script>
  if (entry !== null) entry.factory(() => {}).apply({ layout: 'split' })
</script>
